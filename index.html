<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lil's Haarsalon is verplaatst | Nieuwe website</title>
    <meta name="description" content="Lil's haarsalon in het centrum van Rozenburg. Knippen, kleuren en verzorgen voor dames, heren en kinderen. Gediplomeerde kapsters, betaalbare prijzen." />
    <meta name="robots" content="noindex, follow" />
    <meta http-equiv="refresh" content="0; url=https://0xtsotsi.github.io/lils-haarsalon-site/" />
    <link rel="canonical" href="https://0xtsotsi.github.io/lils-haarsalon-site/" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23205272'/%3E%3Cpath d='M8 16h13m0 0-5-5m5 5-5 5' fill='none' stroke='%23ffffff' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <style>
    :root {
      --paper: oklch(0.975 0.006 235);
      --surface: oklch(1 0 0);
      --ink: oklch(0.27 0.03 245);
      --ink-2: oklch(0.45 0.025 245);
      --line: oklch(0.63 0.022 235);
      --petrol: oklch(0.42 0.075 240);
      --petrol-deep: oklch(0.3 0.055 245);
      --focus: oklch(0.5 0.1 70);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100svh;
      display: flex;
      background: var(--paper);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
        Helvetica, Arial, sans-serif;
      line-height: 1.55;
    }

    main {
      margin: auto;
      width: 100%;
      max-width: 34rem;
      padding: 3rem 1.25rem;
    }

    .label {
      margin: 0 0 0.75rem;
      font-size: 0.8125rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-2);
    }

    h1 {
      margin: 0 0 1rem;
      font-size: clamp(1.5rem, 1.15rem + 1.6vw, 2.125rem);
      line-height: 1.2;
      text-wrap: balance;
    }

    .lead {
      margin: 0 0 1.75rem;
      font-size: 1.0625rem;
      color: var(--ink-2);
    }

    .action {
      margin: 0 0 1.25rem;
    }

    .button {
      display: inline-block;
      padding: 0.875rem 1.375rem;
      border: 2px solid transparent;
      border-radius: 0.5rem;
      background: var(--petrol);
      color: #fff;
      font-weight: 600;
      text-decoration: none;
    }

    .button:hover {
      background: var(--petrol-deep);
    }

    .button:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }

    .note {
      margin: 0;
      padding-top: 1.25rem;
      border-top: 1px solid var(--line);
      font-size: 0.9375rem;
      color: var(--ink-2);
      overflow-wrap: anywhere;
    }
    </style>
  </head>
  <body>
    <main>
      <p class="label">Verplaatst</p>
      <h1>De website van Lil's Haarsalon staat nu op een nieuwe locatie</h1>
      <p class="lead">
        Je wordt automatisch doorgestuurd. Werkt dat niet, open de website dan
        handmatig.
      </p>
      <p class="action">
        <a class="button" href="https://0xtsotsi.github.io/lils-haarsalon-site/">Open de nieuwe website van Lil's Haarsalon</a>
      </p>
      <p class="note">Nieuwe adres: https://0xtsotsi.github.io/lils-haarsalon-site/</p>
    </main>
  </body>
</html>
